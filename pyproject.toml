[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-ops-engine"
version = "0.1.0"
description = "MLOps for urban models — MLflow tracking + FastAPI predict (congestion score)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Douae El Assal", email = "201406601+anadouae@users.noreply.github.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "mlflow>=2.14",
  "joblib>=1.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-cov>=5.0"]

[project.scripts]
model-ops-train = "model_ops_engine.train:main"
model-ops-serve = "model_ops_engine.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
